id: device-control-reservation-owner
language: rust
severity: error
message: Use openlogi_device::ControlCapturePolicy::is_reserved; control reservations belong to the device session owner.
note: |
  Keyboard touchpad clicks stay native; only presenter capture may divert the top tap.
  Reusing the raw keyboard reservation list bypasses the family-specific decision.
files:
  - crates/**/*.rs
ignores:
  - crates/openlogi-device/src/session/keyboard.rs
rule:
  kind: identifier
  regex: '^(RESERVED_KEYBOARD_CONTROLS|is_reserved_keyboard_control)$'
