# Owner: openlogi_ipc::client::Observer — the observe loop's connection state:
# the client, the generation ledger, and the one observe call in flight, armed
# again after every answer. Only the IPC clients are in scope: the agent side
# serves these calls.
id: ipc-observe-owner
language: rust
severity: error
message: Use openlogi_ipc::client::Observer (including Observer::highlight), then next(); raw observation calls belong in openlogi-ipc.
note: |
  The settings app and the overlay each kept their own client, ledger and
  call-in-flight bundle around these calls. See "Single source of truth"
  in AGENTS.md.
files:
  - crates/openlogi-desktop/**/*.rs
  - crates/openlogi-overlay/**/*.rs
  - crates/openlogi-cli/**/*.rs
rule:
  any:
    - pattern: $CLIENT.observe_action_ring($$$ARGS)
    - pattern: $CLIENT.observe_notices($$$ARGS)
    - pattern: $CLIENT.observe_lock_keys($$$ARGS)
    - pattern: $CLIENT.observe_highlight($$$ARGS)
    # tarpc's observe takes a request context first; GPUI's `cx.observe` takes
    # an entity and a closure, and is not this.
    - all:
        - pattern: $CLIENT.observe($CTX, $SINCE)
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: '(?i)context|ctx'
